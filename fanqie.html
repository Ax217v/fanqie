<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="tN8TjSL889W9Xm8o8NGDV0">
<head data-page-node-id="3rRrJLke6Lx8G7kFGgTyyI">
<meta charset="utf-8" data-page-node-id="soaCoLafoAv9vDf2QsKhGq">
<meta name="viewport" content="width=device-width, initial-scale=1" data-page-node-id="QOK8hS0oVZ5AsMyWungfBX">
<title>我的番茄钟 v2</title>
<style>
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #fff5f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 40px 60px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    text-align: center;
  }
  h1 { color: #e74c3c; margin-top: 0; }
  .mode {
    display: inline-block;
    font-size: 14px;
    padding: 4px 14px;
    border-radius: 20px;
    background: #ffe5e0;
    color: #e74c3c;
    margin-bottom: 8px;
  }
  .mode.rest { background: #e0f3ff; color: #2980b9; }
  .time {
    font-size: 64px;
    font-weight: bold;
    color: #333333;
    letter-spacing: 4px;
    margin: 20px 0;
  }
  button {
    font-size: 16px;
    padding: 10px 24px;
    margin: 0 6px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .start { background: #e74c3c; color: #ffffff; }
  .pause { background: #f39c12; color: #ffffff; }
  .reset { background: #bdc3c7; color: #ffffff; }
  .count { margin-top: 20px; color: #888888; }
</style>
</head>
<body data-page-node-id="j5qgZY6qo9oLBEu6OzZjfi">
  <div class="card" data-page-node-id="o8jOUoB2K8KGMwZiystOlB">
    <h1 data-page-node-id="WFxfrf80pu1H3sRoHnvpCz">🍅 番茄钟</h1>
    <div class="mode" id="mode" data-page-node-id="zDra3sUs8UZsHFhTcmCstA">🍅 专注中</div>
    <div class="time" id="time" data-page-node-id="3xYBbELRfl8vkPyZFe3nve">25:00</div>
    <div data-page-node-id="QUdidUXRFsShKY7J3zF8Kq">
      <button class="start" onclick="start()" data-page-node-id="9KA1htox3taZwdLaHxEHGv">开始</button>
      <button class="pause" onclick="pause()" data-page-node-id="HpEuZQ3bvJfk9ycfyFvxru">暂停</button>
      <button class="reset" onclick="reset()" data-page-node-id="X4ZDdlosiT3mn6SM9x2sHL">重置</button>
    </div>
    <div class="count" data-page-node-id="b8eRfPdCZQStEZ8q52vnjf">今天已完成 <span id="done" data-page-node-id="yCBDxZQfWbVl4mHZb2H6Nj">0</span> 个番茄</div>
  </div>
<script>
  var workTime = 25 * 60; // 专注 25 分钟
  var restTime = 5 * 60;  // 休息 5 分钟
  var mode = "work";      // work = 专注, rest = 休息
  var left = workTime;
  var timer = null;
  var timeEl = document.getElementById("time");
  var doneEl = document.getElementById("done");
  var modeEl = document.getElementById("mode");

  function show() {
    var m = Math.floor(left / 60);
    var s = left % 60;
    timeEl.textContent = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function setMode(nextMode, seconds) {
    mode = nextMode;
    left = seconds;
    if (mode === "work") {
      modeEl.textContent = "🍅 专注中";
      modeEl.className = "mode";
    } else {
      modeEl.textContent = "☕ 休息中";
      modeEl.className = "mode rest";
    }
    show();
  }

  function beep() {
    // 用 Web Audio 播放"叮"两声，不需要任何外部音频文件
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.25].forEach(function (delay) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.3, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.2);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + 0.25);
      });
    } catch (e) { /* 浏览器不支持声音就静默 */ }
  }

  function start() {
    if (timer) return; // 已经在跑了，防止重复
    timer = setInterval(function () {
      if (left > 0) {
        left--;
        show();
      } else {
        finish();
      }
    }, 1000);
  }

  function pause() {
    clearInterval(timer);
    timer = null;
  }

  function reset() {
    pause();
    setMode("work", workTime);
  }

  function finish() {
    pause();
    beep();
    if (mode === "work") {
      alert("🍅 一个番茄完成！进入 5 分钟休息");
      doneEl.textContent = parseInt(doneEl.textContent) + 1;
      setMode("rest", restTime);
    } else {
      alert("☕ 休息结束！开始下一个番茄");
      setMode("work", workTime);
    }
  }

  show();
</script>
</body>
</html>
