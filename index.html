<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="9OzTEfC6VMGrpDNCnQp2FQ">
<head data-page-node-id="02j7pDk5I4Gu2AOZCAc6Qy">
<meta charset="utf-8" data-page-node-id="vyLCn7YvG0MyueVH6M33DN">
<meta name="viewport" content="width=device-width, initial-scale=1" data-page-node-id="y8lZ1d4vP6YEnDmw6wafu9">
<title>我的番茄钟</title>
<style>
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #fff5f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 40px 60px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    text-align: center;
  }
  h1 { color: #e74c3c; margin-top: 0; }
  .time {
    font-size: 64px;
    font-weight: bold;
    color: #333333;
    letter-spacing: 4px;
    margin: 20px 0;
  }
  button {
    font-size: 16px;
    padding: 10px 24px;
    margin: 0 6px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .start { background: #e74c3c; color: #ffffff; }
  .pause { background: #f39c12; color: #ffffff; }
  .reset { background: #bdc3c7; color: #ffffff; }
  .count { margin-top: 20px; color: #888888; }
</style>
</head>
<body data-page-node-id="0i1pNgPwyvnicFQ4tGLR1L">
  <div class="card" data-page-node-id="5YlBXVURymcQu8FfzBasTQ">
    <h1 data-page-node-id="ybFEdroX7o9Eys76RaUtSE">🍅 番茄钟</h1>
    <div class="time" id="time" data-page-node-id="0lDpCZLUe6J4zzwyl58bRO">25:00</div>
    <div data-page-node-id="bB6JrDTV681i9LgQF0azkA">
      <button class="start" onclick="start()" data-page-node-id="kRvo2Lh5QVLyJGkqG93uza">开始</button>
      <button class="pause" onclick="pause()" data-page-node-id="a0K9FHZ3zslj6ZFeVzQOqi">暂停</button>
      <button class="reset" onclick="reset()" data-page-node-id="dhKPerJ4WIxv3nLGPmC5ET">重置</button>
    </div>
    <div class="count" data-page-node-id="jXj6w4M8yjHDg06pXcmDQ6">今天已完成 <span id="done" data-page-node-id="NeuBV2bJSGwH9GCioHCdmt">0</span> 个番茄</div>
  </div>
<script>
  var total = 25 * 60; // 一个番茄 = 25 分钟
  var left = total;
  var timer = null;
  var timeEl = document.getElementById("time");
  var doneEl = document.getElementById("done");

  function show() {
    var m = Math.floor(left / 60);
    var s = left % 60;
    timeEl.textContent = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function start() {
    if (timer) return; // 已经在跑了，防止重复
    timer = setInterval(function () {
      if (left > 0) {
        left--;
        show();
      } else {
        finish();
      }
    }, 1000);
  }

  function pause() {
    clearInterval(timer);
    timer = null;
  }

  function reset() {
    pause();
    left = total;
    show();
  }

  function finish() {
    pause();
    alert("🍅 一个番茄完成！休息 5 分钟吧");
    doneEl.textContent = parseInt(doneEl.textContent) + 1;
    left = total;
    show();
  }

  show();
</script>
</body>
</html>
